<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mec&ko</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    header {
      background-color: #111;
      color: white;
      padding: 15px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #333;
    }

    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
    }

    nav a:hover {
      background-color: #575757;
    }

    .container {
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      padding: 15px;
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .price {
      color: green;
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      background-color: #111;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #444;
    }

    footer {
      background-color: #111;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Mec&ko</h1>
  <p>Moda moderna para todos</p>
</header>

<nav>
  <a href="#">Inicio</a>
  <a href="#">Hombres</a>
  <a href="#">Mujeres</a>
  <a href="#">Contacto</a>
</nav>

<div class="container">
  <h2>Productos</h2>
  <div class="products">

    <div class="card">
      <img src="images (2).jfif" alt="Camisa">
      <h3>Camisa Casual</h3>
      <p class="price">$20</p>
      <button>Comprar</button>
    </div>

    <div class="card">
      <img src="images (3).jfif" alt="Pantalón">
      <h3>Pantalón Jeans</h3>
      <p class="price">$35</p>
      <button>Comprar</button>
    </div>

    <div class="card">
      <img src="images (4).jfif" alt="Vestido">
      <h3>Vestido Elegante</h3>
      <p class="price">$50</p>
      <button>Comprar</button>
    </div>

    <div class="card">
      <img src="descarga.jfif" alt="Zapatos">
      <h3>Zapatos Deportivos</h3>
      <p class="price">$45</p>
      <button>Comprar</button>
    </div>

  </div>
</div>

<footer>
  <p>&copy; 2026 Tienda de Ropa - Todos los derechos reservados</p>
</footer>

</body>
</html>
